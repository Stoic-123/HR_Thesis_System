services:
  # ── MySQL database ───────────────────────────────────────────────────────────
  db:
    image: mariadb:10.11
    container_name: hrms_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_DATABASE: ${DB_NAME:-hrms}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    # No host port mapping — only backend/frontend need to reach the DB
    # and they connect via the internal Docker network (db:3306).
    # Uncomment the line below if you want to inspect the DB with a GUI tool:
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Seed file — only runs once on a fresh/empty volume
      - ./Backend/prisma/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend (Express + Prisma) ───────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hrms_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${DB_USER:-root}:${DB_PASSWORD:-}@db:3306/${DB_NAME:-hrms}
      JWT_SECRET: ${JWT_SECRET:-changeme_use_a_long_random_secret}
      EXPIRED_AT: ${EXPIRED_AT:-2h}
      SERVER_BASE_URL: ${SERVER_BASE_URL:-http://localhost:8080}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-qwen2.5:1.5b}
      DISABLE_RATE_LIMITER: ${DISABLE_RATE_LIMITER:-false}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-5000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-100}
      # ── Cloudflare R2 ──────────────────────────────────────────────────────
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      # ── Telegram ───────────────────────────────────────────────────────────
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TELEGRAM_BACKUP_BOT_TOKEN: ${TELEGRAM_BACKUP_BOT_TOKEN:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      NODE_ENV: ${NODE_ENV:-development}

    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      # Persist uploaded files outside the container
      - uploads_data:/app/public/uploads

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        BACKEND_INTERNAL_URL: "http://backend:8080"
    container_name: hrms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      HOSTNAME: "0.0.0.0"
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"

volumes:
  mysql_data:
  uploads_data:
